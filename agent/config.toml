[listener]
listen_address = "0.0.0.0:50051"

[backup]
source_directory = "/mnt/storage"
target_filesystem_uuid = "74978d88-ddf2-4773-8907-7deb641f32b8"
target_mount_point = "/mnt/backup"
target_xhci_pci = "0000:00:14.0"
schedule_weekday = "Monday"
schedule_time = "05:00"

[monitoring]
# once every X minutes
battery = 5  
cpu = 5
disk = 60
need_reboot = 60

[limits]
# threshold values for alerting
cpu_max_temperature = 85.0
disk_min_free_percent = 10.0
